<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-CUIDO | Cuidamos con empatía, acompañamos con el corazón</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        salvia: '#8FAF9B',
                        oscuro: '#426653',
                        crema: '#F8F5EF',
                        beige: '#EDE5D8',
                        texto: '#29352F',
                        terracota: '#C98570'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-crema text-texto font-sans antialiased">

    <!-- Navegación -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-bold text-oscuro">T-CUIDO</span>
            </div>
            <nav class="hidden md:flex space-x-6 text-sm font-medium">
                <a href="index.html" class="text-oscuro font-semibold">Inicio</a>
                <a href="pages/catalogo.html" class="hover:text-oscuro">Catálogo</a>
                <a href="pages/como-funciona.html" class="hover:text-oscuro">Cómo funciona</a>
                <a href="pages/contacto.html" class="hover:text-oscuro">Contacto</a>
            </nav>
            <div class="flex space-x-3">
                <a href="pages/login.html" class="px-4 py-2 text-sm font-medium text-oscuro border border-oscuro rounded-lg hover:bg-beige/50">Iniciar sesión</a>
                <a href="pages/registro.html" class="px-4 py-2 text-sm font-medium text-white bg-oscuro rounded-lg hover:bg-oscuro/90">Registrarse</a>
            </div>
        </div>
    </header>

    <!-- Sección Hero Principal -->
    <section class="bg-gradient-to-b from-beige/60 to-crema py-16 px-4 text-center">
        <div class="max-w-4xl mx-auto">
            <span class="inline-block bg-salvia/20 text-oscuro text-xs font-semibold px-3 py-1 rounded-full mb-4">Plataforma web de enfermeros y cuidadores en Perú</span>
            <h1 class="text-4xl md:text-5xl font-extrabold text-oscuro tracking-tight mb-6">
                El cuidado que tu familia merece, con la calidez que necesita.
            </h1>
            <p class="text-lg text-texto/80 mb-10 max-w-2xl mx-auto">
                Conectamos a familias y pacientes con profesionales de salud y cuidadores calificados cerca de tu ubicación.
            </p>

            <!-- Buscador Principal Geográfico -->
            <div class="bg-white p-4 md:p-6 rounded-2xl shadow-lg max-w-3xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 text-left mb-1">DEPARTAMENTO</label>
                    <select id="select-departamento" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:outline-none focus:border-oscuro">
                        <option value="">Seleccione departamento</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 text-left mb-1">TIPO DE ATENCIÓN</label>
                    <select id="select-tipo" class="w-full p-3 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:outline-none focus:border-oscuro">
                        <option value="">Cualquier especialidad</option>
                        <option value="enfermero_titulado">Enfermero Titulado</option>
                        <option value="personal_sanitario">Personal Sanitario</option>
                        <option value="cuidadores_no_sanitario">Cuidador No Sanitario</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="btn-buscar" class="w-full bg-oscuro text-white py-3 rounded-xl font-medium hover:bg-oscuro/90 transition shadow-md">
                        Buscar Profesionales
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Script de conexión con la API Flask -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
